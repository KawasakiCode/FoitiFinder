name: foitifinder
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.5
  #reads the running build number, so the app can compare itself against
  #the oldest one the backend still supports (see version_gate.dart)
  package_info_plus: ^8.1.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  firebase_messaging: ^15.2.10
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  http: ^1.6.0
  firebase_storage: ^12.4.10
  cached_network_image: ^3.4.1
  permission_handler: ^12.0.1
  firebase_app_check: ^0.3.2+10
  connectivity_plus: ^7.0.0
  cloud_firestore: ^5.6.12
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  #Generates every launcher density from one source image. The app shipped
  #with Flutter's own logo in mipmap-*, which is the default nobody removes
  #until the day it is in front of a store reviewer.
  flutter_launcher_icons: ^0.14.4

#RUN THIS AFTER CHANGING THE SOURCE IMAGE:
#  flutter pub run flutter_launcher_icons
#
#ADAPTIVE ICONS ARE NOT OPTIONAL on Android 8+: without the background and
#foreground pair below, the launcher draws the legacy square shrunk inside a
#white blob rather than the device's own mask. The foreground image needs its
#artwork inside the middle two thirds - everything outside that is cropped on
#round and squircle masks, which is most phones.
flutter_launcher_icons:
  android: true
  ios: false
  #THE F, AND THE WHOLE NAME WAS TRIED RATHER THAN ASSUMED. These three paths
  #pointed at icon_wordmark.png and icon_wordmark_foreground.png. On a phone
  #the lettering came out about 5px tall - the word is 7.5 times wider than it
  #is tall and a launcher icon is square, so fitting all of it in leaves
  #nothing. Nothing was cropped and it still could not be read.
  #
  #THAT PAIR IS NO LONGER COMMITTED, because nothing read it. To see it on a
  #phone again: `python scripts\make_icon.py --extras`, then point these
  #paths at the two icon_wordmark files.
  #the square legacy icon, used below Android 8
  image_path: "assets/brand/icon.png"
  #A DEEP NAVY, AND IT USED TO BE VIOLET-950 (#2E1065). That was the bug:
  #the old background sat at hue 261 and the gradient's violet end at hue 262,
  #one degree apart, so half the F dissolved into the field and the pink half
  #stood out - the mark read lopsided. This navy is 33 degrees off that violet
  #and very dark, so both ends separate by about the same amount.
  #
  #KEEP THIS IN STEP WITH ICON_BG in scripts/make_icon.py. The script paints
  #the legacy icon's background; this paints the adaptive one's. Change one
  #and the two icons disagree, which only shows up on old Android.
  adaptive_icon_background: "#0B1026"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  #a monochrome layer makes the themed icons on Android 13+ use the app's
  #shape instead of a generic placeholder
  adaptive_icon_monochrome: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/
    #NOT CODE AND NOT DECORATION. The OFL requires the licence to ship with
    #the font, so it is bundled and handed to showLicensePage from main.dart.
    - assets/fonts/OFL-Inter.txt
    #THE LOGO, as a picture - on the login screen and in the three main app
    #bars. These two FILES and not the
    #assets/brand/ FOLDER: that folder also holds four 1024x1024 icon sources
    #which the Android build consumes from outside the APK, and listing the
    #directory would ship about 113 KB of them to every phone for nothing.
    - assets/brand/wordmark_on_light.png
    - assets/brand/wordmark_on_dark.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Inter is a variable font (weight axis 100->900), so a single .ttf covers
  # every weight we use. Bundled locally = offline, and identical on every
  # device.
  #
  # IT MUST COVER GREEK. The app ships Greek strings, and a missing glyph is
  # not an error - Flutter silently borrows one from whatever font the OS
  # offers, which differs per device and looks nothing like the rest of the
  # text. Plus Jakarta Sans, used before this, had no Greek at all.
  # test/font_coverage_test.dart fails if a string needs a glyph this file
  # does not have.
  fonts:
    #THE ONLY FACE IN THE APP, and the only one bundled. Gluten used to be
    #here too - the whole UI as an experiment, plus a 4.5 KB subset the logo
    #was set in - and both are gone: the logo is artwork now (assets/brand/,
    #drawn by scripts/make_icon.py) and nothing else wanted a second face.
    #
    #THERE IS NO FALLBACK CHAIN BEHIND THIS. Inter covers both languages and
    #test/font_coverage_test.dart holds it to that, so a missing glyph is a
    #failing test rather than a character drawn in whatever the phone owns.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

#flutter_native_splash IS DELIBERATELY GONE. It renders a solid colour by
#stretching a one-pixel PNG, which cannot be a gradient - and re-running it
#would overwrite the hand-written gradient in
#android/app/src/main/res/drawable*/launch_background.xml with that pixel.
#A generator that must never be run is worse than no generator.
