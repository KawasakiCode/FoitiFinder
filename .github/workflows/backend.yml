# The backend suite, on every push that touches it.
#
# IT NEEDS NO SECRETS, which is a consequence of two decisions rather than
# luck. Identity comes from one FastAPI dependency, and conftest replaces it -
# so there is no token to verify and no Firebase to reach. And firebase_app
# treats a missing serviceAccountKey.json as a warning rather than a fatal
# error, precisely so a machine with no credentials can still import the app.
#
# IT ALSO PROVES THE MIGRATIONS. The service container starts empty and
# conftest builds the schema with `alembic upgrade head`, so every run is the
# from-zero case that the chain could not do at all until it was squashed into
# a baseline. A broken migration fails CI before it reaches Neon.

name: backend

on:
  # ON DEMAND, from the Actions tab. The path filters mean a workflow can go
  # a long time without running - useful, but it also leaves no way to check
  # one still works without inventing a commit that touches it.
  workflow_dispatch:

  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        # NOT SQLite. The models use Postgres arrays and the feed compares
        # dates the way Postgres does; a suite that passed against another
        # engine would be worse than no suite.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foitifinder_test
        ports:
          - 5432:5432
        # the runner must not start the tests before the database answers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest refuses anything that is not local and not named like a test
      # database. A service container is reachable on localhost, so both of
      # its guards are satisfied honestly rather than bypassed.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foitifinder_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PINNED, and matched to backend/.python-version so CI and Render
          # cannot drift apart. 3.10 was never a requirement of this code - it
          # was left over from a TensorFlow/MediaPipe experiment whose
          # dependencies were still in requirements.txt, one of which had no
          # wheel for anything newer.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: tests
        run: python -m pytest -q

      - name: models and migrations agree
        # CATCHES THE COMMIT THAT EDITS models.py AND FORGETS THE MIGRATION.
        # The tests would still pass - they build the schema from the same
        # migrations - and the mismatch would only surface on deploy, as a
        # column the code expects and the database does not have.
        #
        # Runs after the tests, against the database they just built.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foitifinder_test
        run: python -m alembic check

  # --------------------------------------------------------------------------
  # Everything below is the deploy half, and it runs ONLY after the tests pass.
  #
  # RENDER'S AUTO-DEPLOY MUST BE OFF for this to mean anything. Deploying on
  # push puts the new code live before the migration has run, which is the one
  # ordering that breaks: code referencing a column the database does not have
  # yet. Doing it here reverses that - the schema moves first, and old code
  # simply ignores a column it has never heard of.
  #
  # That tolerance only holds for ADDITIVE migrations. A drop or a rename still
  # needs two deploys: ship code that stops using the column, then remove it.
  # --------------------------------------------------------------------------

  # IS THERE ANYTHING TO DEPLOY?
  #
  # The suite runs for every change under backend/, which is right: editing a
  # test should run that test, and the seeding tools import the app's own
  # models so they break when the schema moves. But none of that reaches the
  # server. A commit touching only tools/ used to migrate Neon and restart
  # Render over a file neither of them has ever read.
  #
  # EXCLUSIONS, NOT A LIST OF WHAT COUNTS. Both spell the same set today, and
  # they fail in opposite directions. A new module missing from an allowlist is
  # silently never deployed - the code is on main, the workflow is green, and
  # production is running something else. A new tools/ subdirectory missing
  # from the exclusions costs one redundant restart. Only one of those is
  # worth debugging at midnight.
  changes:
    needs: tests
    # PUSHES TO main ONLY, the same guard the two jobs below carry: those hold
    # production credentials and this repository is public.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      deployable: ${{ steps.check.outputs.deployable }}

    steps:
      - uses: actions/checkout@v4
        with:
          # the diff needs the commit this push started FROM, which the
          # default shallow clone does not contain
          fetch-depth: 0

      - id: check
        # passed as environment variables rather than interpolated into the
        # script, so nothing from the event payload is read by the shell
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A FIRST PUSH OR A FORCE PUSH has no usable starting point - the
          # value is all zeros, or a commit that no longer exists. Deploy
          # rather than guess: a redundant restart costs a cold start, and a
          # migration that was skipped by accident costs an outage.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::Cannot resolve the previous commit, so this deploys unconditionally."
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # :(exclude) is a git pathspec, so git does the matching rather than
          # a hand-rolled glob. A bare directory name covers everything under
          # it; no wildcards, no shell expansion.
          changed=$(git diff --name-only "$BEFORE" "$AFTER" -- \
            backend \
            ':(exclude)backend/tools' \
            ':(exclude)backend/tests' \
            ':(exclude)backend/requirements-dev.txt')

          if [ -z "$changed" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing the server runs changed. Neon and Render were left alone."
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            printf 'deploying because these changed:\n%s\n' "$changed"
          fi

  migrate:
    needs: [tests, changes]
    # A SKIPPED DEPENDENCY SKIPS THIS TOO, so the push/branch guard above
    # covers this job as well; the output check is what adds the path filter.
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: migrate neon
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::NEON_DATABASE_URL is not set, so nothing was migrated."
            echo "::notice::Add it as a repository secret to turn this on."
            exit 0
          fi
          python -m alembic upgrade head
          # proves the schema now matches models.py, rather than assuming the
          # upgrade did what the revision claimed
          python -m alembic check

  deploy:
    needs: [changes, migrate]
    # SKIPPED WITH migrate, which a skipped `needs` would do on its own - said
    # out loud because "the schema moved but the code did not ship" is the one
    # state this ordering exists to prevent.
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: tell render to deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK is not set, so nothing was deployed."
            echo "::notice::Add it as a repository secret and turn Render's"
            echo "::notice::auto-deploy OFF to turn this on."
            exit 0
          fi
          # THE HOOK ONLY QUEUES THE DEPLOY. A 200 here means Render accepted
          # the request, not that the deploy succeeded - watch the Render
          # dashboard for that.
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deploy requested"
